# =============================================
# RPG Ficha — application.properties
# =============================================

# --- Servidor ---
server.port=8080

# --- PostgreSQL ---
# Para rodar localmente: crie o banco com `createdb rpg_ficha`
# Troque usuário/senha conforme sua instalação
spring.datasource.url=jdbc:postgresql://localhost:5432/rpg_ficha
spring.datasource.username=postgres
spring.datasource.password=joao-07
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate = Hibernate checa o schema mas NÃO altera (Flyway cuida disso)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway (migrations automáticas ao subir o app) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- CORS (Vue dev server em :5173) ---
app.cors.allowed-origins=http://localhost:5173

# --- Logs ---
logging.level.com.rpg=DEBUG
logging.level.org.flywaydb=INFO